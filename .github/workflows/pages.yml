name: Pages

# Publish site/ to GitHub Pages. The landing page is static — no build step,
# just a staging copy so the screenshots that live in docs/ (where the README
# points at them) are served from one place instead of a second copy in git.
#
# No repository setting to flip first: configure-pages runs with enablement,
# so the first run turns Pages on (source: GitHub Actions) and deploys.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/*.png'
      - 'docs/*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; let queued runs finish in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage _site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -R site/. _site/
          rm -f _site/preview.sh
          # Screenshots shared with the README.
          cp docs/terminal.png docs/dashboard.png _site/assets/
          # Belt and braces: Pages should not try to run Jekyll over this.
          touch _site/.nojekyll
          ls -R _site

      # enablement lets the first run switch Pages on itself (build type
      # "workflow"). Without it the action 404s on a repo where Pages has
      # never been configured, and the deploy needs a manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
