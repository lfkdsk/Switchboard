name: Worker CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/registry.js
          node --check src/circuit.js

  deploy:
    name: Production deploy
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://shell.lfkdsk.org
    concurrency:
      group: switchboard-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Cloudflare credentials
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || "";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || "";
          if (!/^[\x21-\x7e]+$/.test(token)) {
            console.error("::error::CLOUDFLARE_API_TOKEN is missing or contains non-ASCII characters; copy a fresh token into the production Environment secret.");
            process.exit(1);
          }
          if (!/^[0-9a-f]{32}$/i.test(account)) {
            console.error("::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal account id.");
            process.exit(1);
          }
          NODE
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply switchboard_db --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 https://shell.lfkdsk.org/healthz | grep -qx ok
